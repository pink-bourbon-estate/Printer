[package]
name = "printer"
version = "0.1.0"
edition = "2024"
description = "Local print and scan for an IPP/eSCL printer. No vendor app, no account, no subscription, no internet connection."
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
mdns-sd = "0.21.7"
roxmltree = "0.21.2"
ureq = "2"


[profile.release]
opt-level = 3
lto = "thin"
strip = true
